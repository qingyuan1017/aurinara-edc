name: Deploy AWS
on:
  push: {branches: [main]}
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the temporary staging environment before production
        required: false
        default: false
        type: boolean
permissions: {contents: read, id-token: write}
env: {AWS_REGION: us-east-1}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs: {image: '${{ steps.digest.outputs.image }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ vars.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::730335504220:role/aurinara-edc-github-deployment' }}", aws-region: '${{ env.AWS_REGION }}'}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --platform linux/amd64 --push -t "${{ vars.APPLICATION_REPOSITORY_URI || '730335504220.dkr.ecr.us-east-1.amazonaws.com/aurinara-edc/application' }}:${GITHUB_SHA}" backend
      - id: digest
        run: echo "image=${{ vars.APPLICATION_REPOSITORY_URI || '730335504220.dkr.ecr.us-east-1.amazonaws.com/aurinara-edc/application' }}@$(aws ecr describe-images --repository-name aurinara-edc/application --image-ids imageTag=${GITHUB_SHA} --query 'imageDetails[0].imageDigest' --output text)" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@v0
        with: {image: '${{ steps.digest.outputs.image }}', artifact-name: edc-sbom.spdx.json}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: {image-ref: '${{ steps.digest.outputs.image }}', severity: 'CRITICAL,HIGH', exit-code: '1', ignore-unfixed: true}
  staging:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_staging }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: aurinara-edc-staging-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ vars.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::730335504220:role/aurinara-edc-github-deployment' }}", aws-region: '${{ env.AWS_REGION }}'}
      - name: Package and deploy consumer stack
        env:
          APPLICATION_IMAGE: ${{ needs.build.outputs.image }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'aurinara.com' }}
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER || 'cloudflare' }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN || 'arn:aws:acm:us-east-1:730335504220:certificate/57c0420d-a384-43ae-97c2-e7a6bb461b6c' }}
          PLATFORM_STACK_NAME: aurinara-platform-staging
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN || 'arn:aws:iam::730335504220:role/aurinara-edc-cloudformation-execution' }}
          DEPLOYMENT_PROFILE: ${{ vars.DEPLOYMENT_PROFILE || 'budget' }}
        run: |
          bash scripts/aws-package-nested-templates.sh infra/cloudformation/environment.yaml "${{ vars.TEMPLATE_BUCKET_NAME || 'aurinara-edc-bootstrap-templatebucket-8fud9kzntgyx' }}" "templates/${GITHUB_SHA}" packaged.yaml
          bash scripts/aws-deploy-environment.sh aurinara-edc-staging staging 10.30.0.0/16 db.t4g.small
      - name: Configure Cloudflare DNS-only CNAME
        if: ${{ vars.DNS_PROVIDER != 'route53' }}
        env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ZONE_ID: '${{ vars.CLOUDFLARE_ZONE_ID }}'}
        run: bash scripts/cloudflare-upsert-dns.sh aurinara-edc-staging
      - name: Load platform identity outputs
        run: |
          output() { aws cloudformation describe-stacks --stack-name aurinara-platform-staging --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          application_url=$(aws cloudformation describe-stacks --stack-name aurinara-edc-staging --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" --output text)
          echo "APPLICATION_URL=${application_url}" >> "$GITHUB_ENV"
          echo "USER_POOL_ID=$(output UserPoolId)" >> "$GITHUB_ENV"
          echo "SPA_CLIENT_ID=$(output EdcSpaClientId)" >> "$GITHUB_ENV"
          echo "COGNITO_DOMAIN=$(output CognitoDomain)" >> "$GITHUB_ENV"
          echo "PLATFORM_URL=$(output PlatformUrl)" >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_PLATFORM_API_BASE_URL: ${{ env.PLATFORM_URL }}/v1
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: ${{ env.USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.SPA_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ env.COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: ${{ env.APPLICATION_URL }}/auth/cognito/callback
          VITE_COGNITO_SCOPES: openid email profile
          VITE_MANAGED_LOGIN_ONLY: 'true'
        run: npm ci && npm run api:gen && npm run build
      - name: Publish and smoke test
        run: |
          bucket=$(aws cloudformation describe-stacks --stack-name aurinara-edc-staging --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          distribution=$(aws cloudformation describe-stacks --stack-name aurinara-edc-staging --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws s3 sync frontend/dist "s3://${bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'
          curl --fail --retry 12 --retry-delay 10 "${APPLICATION_URL}/api/v1/health/ready"
  production:
    needs: [build, staging]
    if: ${{ always() && needs.build.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: aurinara-edc-production-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "${{ vars.AWS_DEPLOYMENT_ROLE_ARN || 'arn:aws:iam::730335504220:role/aurinara-edc-github-deployment' }}", aws-region: '${{ env.AWS_REGION }}'}
      - name: Snapshot database when present
        run: |
          db=$(aws cloudformation describe-stacks --stack-name aurinara-edc-production --query "Stacks[0].Outputs[?OutputKey=='DatabaseIdentifier'].OutputValue" --output text 2>/dev/null || true)
          if [[ -n "$db" && "$db" != None ]]; then
            snapshot="${db}-${GITHUB_RUN_ID}"
            if ! aws rds describe-db-snapshots --db-snapshot-identifier "$snapshot" >/dev/null 2>&1; then
              aws rds create-db-snapshot --db-instance-identifier "$db" --db-snapshot-identifier "$snapshot"
            fi
            aws rds wait db-snapshot-completed --db-snapshot-identifier "$snapshot"
          fi
      - name: Package and deploy consumer stack
        env:
          APPLICATION_IMAGE: ${{ needs.build.outputs.image }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN || 'aurinara.com' }}
          DNS_PROVIDER: ${{ vars.DNS_PROVIDER || 'cloudflare' }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          CERTIFICATE_ARN: ${{ vars.CERTIFICATE_ARN || 'arn:aws:acm:us-east-1:730335504220:certificate/57c0420d-a384-43ae-97c2-e7a6bb461b6c' }}
          PLATFORM_STACK_NAME: aurinara-platform-production
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN || 'arn:aws:iam::730335504220:role/aurinara-edc-cloudformation-execution' }}
          DEPLOYMENT_PROFILE: ${{ vars.DEPLOYMENT_PROFILE || 'budget' }}
        run: |
          bash scripts/aws-package-nested-templates.sh infra/cloudformation/environment.yaml "${{ vars.TEMPLATE_BUCKET_NAME || 'aurinara-edc-bootstrap-templatebucket-8fud9kzntgyx' }}" "templates/${GITHUB_SHA}" packaged.yaml
          bash scripts/aws-deploy-environment.sh aurinara-edc-production production 10.70.0.0/16 db.t4g.small
          aws cloudformation update-termination-protection --enable-termination-protection --stack-name aurinara-edc-production
      - name: Configure Cloudflare DNS-only CNAME
        if: ${{ vars.DNS_PROVIDER != 'route53' }}
        env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}', CLOUDFLARE_ZONE_ID: '${{ vars.CLOUDFLARE_ZONE_ID }}'}
        run: bash scripts/cloudflare-upsert-dns.sh aurinara-edc-production
      - name: Load platform identity outputs
        run: |
          output() { aws cloudformation describe-stacks --stack-name aurinara-platform-production --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          application_url=$(aws cloudformation describe-stacks --stack-name aurinara-edc-production --query "Stacks[0].Outputs[?OutputKey=='ApplicationUrl'].OutputValue" --output text)
          echo "APPLICATION_URL=${application_url}" >> "$GITHUB_ENV"
          echo "USER_POOL_ID=$(output UserPoolId)" >> "$GITHUB_ENV"
          echo "SPA_CLIENT_ID=$(output EdcSpaClientId)" >> "$GITHUB_ENV"
          echo "COGNITO_DOMAIN=$(output CognitoDomain)" >> "$GITHUB_ENV"
          echo "PLATFORM_URL=$(output PlatformUrl)" >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_PLATFORM_API_BASE_URL: ${{ env.PLATFORM_URL }}/v1
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: ${{ env.USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ env.SPA_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ env.COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: ${{ env.APPLICATION_URL }}/auth/cognito/callback
          VITE_COGNITO_SCOPES: openid email profile
          VITE_MANAGED_LOGIN_ONLY: 'true'
        run: npm ci && npm run api:gen && npm run build
      - run: |
          bucket=$(aws cloudformation describe-stacks --stack-name aurinara-edc-production --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" --output text)
          distribution=$(aws cloudformation describe-stacks --stack-name aurinara-edc-production --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" --output text)
          aws s3 sync frontend/dist "s3://${bucket}" --delete
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*'
          curl --fail --retry 12 --retry-delay 10 "${APPLICATION_URL}/api/v1/health/ready"


