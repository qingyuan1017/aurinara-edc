name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions: {contents: read}
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip, cache-dependency-path: backend/pyproject.toml}
      - run: pip install -e '.[dev]'
      - run: ruff check app scripts
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run api:gen
      - run: npm test -- --run
      - run: npm run build
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install cfn-lint pytest
      - run: cfn-lint -i W1100 W1101 W3002 W3045 -- infra/cloudformation/*.yaml
      - run: pytest -q tests/test_cloudflare_dns.py
      - run: docker build backend
