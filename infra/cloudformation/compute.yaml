AWSTemplateFormatVersion: '2010-09-09'
Description: Aurinara EDC ECS API, projection/export workers, migrations, and internal ALB.

Parameters:
  Environment: {Type: String, AllowedValues: [staging, production]}
  ServicesEnabled: {Type: String, AllowedValues: ['true', 'false'], Default: 'false'}
  ApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  MigrationApplicationImage: {Type: String, AllowedPattern: '^.+@sha256:[0-9a-f]{64}$'}
  VpcId: {Type: AWS::EC2::VPC::Id}
  AppSubnetIds: {Type: List<AWS::EC2::Subnet::Id>}
  AlbSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  ApiSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  WorkerSecurityGroupId: {Type: AWS::EC2::SecurityGroup::Id}
  DatabaseEndpoint: {Type: String}
  DatabaseSecretArn: {Type: String}
  ApplicationSecretArn: {Type: String}
  DataKeyArn: {Type: String}
  SharedIdentityKeyArn: {Type: String}
  AttachmentBucketName: {Type: String}
  ProjectionQueueUrl: {Type: String}
  UserPoolId: {Type: String}
  SpaClientId: {Type: String}
  JwtIssuer: {Type: String}
  JwtJwksUrl: {Type: String}
  CognitoDomain: {Type: String}
  ApplicationUrl: {Type: String}
  PlatformPrivateUrl: {Type: String}
  ServiceTokenUrl: {Type: String}
  ServiceClientId: {Type: String}
  ServiceClientSecretArn: {Type: String}

Conditions:
  IsProduction: !Equals [!Ref Environment, production]
  ServicesActive: !Equals [!Ref ServicesEnabled, 'true']

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub aurinara-edc-${Environment}
      ClusterSettings: [{Name: containerInsights, Value: enhanced}]
      Configuration: {ExecuteCommandConfiguration: {Logging: NONE}}
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties: {RetentionInDays: !If [IsProduction, 365, 90], KmsKeyId: !Ref DataKeyArn}
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-runtime-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: [!Ref DatabaseSecretArn, !Ref ApplicationSecretArn, !Ref ServiceClientSecretArn]}
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:DescribeKey'], Resource: [!Ref DataKeyArn, !Ref SharedIdentityKeyArn]}
  ApplicationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]}
      Policies:
        - PolicyName: attachments-and-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket], Resource: [!Sub 'arn:${AWS::Partition}:s3:::${AttachmentBucketName}', !Sub 'arn:${AWS::Partition}:s3:::${AttachmentBucketName}/*']}
              - {Effect: Allow, Action: ['kms:Decrypt', 'kms:Encrypt', 'kms:GenerateDataKey', 'kms:DescribeKey'], Resource: !Ref DataKeyArn}
              - {Effect: Allow, Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes], Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:aurinara-edc-${Environment}-platform'}

  InternalLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ae-${Environment}-alb
      Scheme: internal
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroupId]
      Subnets: !Ref AppSubnetIds
      LoadBalancerAttributes: [{Key: deletion_protection.enabled, Value: !If [IsProduction, 'true', 'false']}, {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}]
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /api/v1/health/ready
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: '30'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties: {LoadBalancerArn: !Ref InternalLoadBalancer, Port: 80, Protocol: HTTP, DefaultActions: [{Type: forward, TargetGroupArn: !Ref ApiTargetGroup}]}

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-edc-${Environment}-api
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: scratch-init
          Image: !Ref ApplicationImage
          User: '0'
          Command: [/bin/sh, -c, 'chmod 1777 /tmp']
          Essential: false
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
        - Name: api
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, gunicorn, 'app.main:app', --bind, '0.0.0.0:8000', --workers, '2', --worker-class, uvicorn.workers.UvicornWorker, --access-logfile, '-']
          DependsOn: [{ContainerName: scratch-init, Condition: SUCCESS}]
          Essential: true
          PortMappings: [{ContainerPort: 8000, Protocol: tcp}]
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: &ApplicationEnvironment
            - {Name: ENVIRONMENT, Value: !Ref Environment}
            - {Name: ENVIRONMENT_NAMESPACE, Value: !Ref Environment}
            - {Name: SECRETS_NAMESPACE, Value: !Sub 'aurinara-edc/${Environment}'}
            - {Name: LOGGING_NAMESPACE, Value: !Sub 'aurinara-edc/${Environment}'}
            - {Name: DATABASE_HOST, Value: !Ref DatabaseEndpoint}
            - {Name: DATABASE_PORT, Value: '5432'}
            - {Name: DATABASE_NAME, Value: aurinara_edc}
            - {Name: DATABASE_USER, Value: aurinara_edc}
            - {Name: DATABASE_POOL_SIZE, Value: '10'}
            - {Name: DATABASE_MAX_OVERFLOW, Value: '20'}
            - {Name: DEBUG, Value: 'false'}
            - {Name: LOCAL_AUTH_ENABLED, Value: 'false'}
            - {Name: AUTH_ISSUER, Value: !Ref JwtIssuer}
            - {Name: AUTH_AUDIENCE, Value: !Ref SpaClientId}
            - {Name: AUTH_JWKS_URL, Value: !Ref JwtJwksUrl}
            - {Name: COGNITO_USER_POOL_ID, Value: !Ref UserPoolId}
            - {Name: COGNITO_REGION, Value: !Ref AWS::Region}
            - {Name: COGNITO_APP_CLIENT_ID, Value: !Ref SpaClientId}
            - {Name: COGNITO_DOMAIN, Value: !Ref CognitoDomain}
            - {Name: COGNITO_REDIRECT_URI, Value: !Sub '${ApplicationUrl}/auth/cognito/callback'}
            - {Name: PLATFORM_CONTROL_PLANE_URL, Value: !Ref PlatformPrivateUrl}
            - {Name: PLATFORM_AUTHORIZATION_MODE, Value: enforced}
            - {Name: PLATFORM_IDENTITY_ISSUER, Value: !Ref JwtIssuer}
            - {Name: PLATFORM_SERVICE_TOKEN_URL, Value: !Ref ServiceTokenUrl}
            - {Name: PLATFORM_SERVICE_CLIENT_ID, Value: !Ref ServiceClientId}
            - {Name: PLATFORM_SERVICE_AUDIENCE, Value: ''}
            - {Name: PLATFORM_SERVICE_RESOURCE, Value: ''}
            - {Name: PLATFORM_SERVICE_SCOPE, Value: aurinara-platform/service}
            - {Name: PLATFORM_EVENT_QUEUE_URL, Value: !Ref ProjectionQueueUrl}
            - {Name: PLATFORM_EVENT_REGION, Value: !Ref AWS::Region}
            - {Name: OBJECT_STORAGE_BACKEND, Value: s3}
            - {Name: OBJECT_STORAGE_NAMESPACE, Value: !Ref Environment}
            - {Name: S3_BUCKET_NAME, Value: !Ref AttachmentBucketName}
            - {Name: S3_REGION, Value: !Ref AWS::Region}
            - {Name: BACKUP_ENABLED, Value: 'true'}
            - {Name: RESTORE_ENABLED, Value: 'true'}
            - {Name: LOG_JSON, Value: 'true'}
          Secrets: &ApplicationSecrets
            - {Name: DATABASE_PASSWORD, ValueFrom: !Sub '${DatabaseSecretArn}:password::'}
            - {Name: SECRET_KEY, ValueFrom: !Sub '${ApplicationSecretArn}:secret_key::'}
            - {Name: PLATFORM_SERVICE_CLIENT_SECRET, ValueFrom: !Sub '${ServiceClientSecretArn}:client_secret::'}
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: api}}
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ServicesActive, 2, 0]
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref ApiSecurityGroupId], Subnets: !Ref AppSubnetIds}}
      LoadBalancers: [{ContainerName: api, ContainerPort: 8000, TargetGroupArn: !Ref ApiTargetGroup}]

  ProjectionTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-edc-${Environment}-projection
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      ContainerDefinitions:
        - Name: projection
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, -m, app.workers.platform_projection_worker, --watch]
          Essential: true
          ReadonlyRootFilesystem: true
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: projection}}
  ProjectionService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: platform-projection
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ProjectionTaskDefinition
      DesiredCount: !If [ServicesActive, !If [IsProduction, 2, 1], 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 50, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}
  ExportTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-edc-${Environment}-export
      Cpu: '1024'
      Memory: '2048'
      EphemeralStorage: {SizeInGiB: 50}
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: scratch-init
          Image: !Ref ApplicationImage
          User: '0'
          Command: [/bin/sh, -c, 'chmod 1777 /tmp']
          Essential: false
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
        - Name: export
          Image: !Ref ApplicationImage
          Command: [python, scripts/aws_entrypoint.py, python, -m, app.workers.export_queue_worker, --watch]
          DependsOn: [{ContainerName: scratch-init, Condition: SUCCESS}]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: export}}
  ExportService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: export-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ExportTaskDefinition
      DesiredCount: !If [ServicesActive, 1, 0]
      LaunchType: FARGATE
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 0, MaximumPercent: 200}
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref WorkerSecurityGroupId], Subnets: !Ref AppSubnetIds}}
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub aurinara-edc-${Environment}-migration
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationTaskRole.Arn
      Volumes: [{Name: scratch}]
      ContainerDefinitions:
        - Name: scratch-init
          Image: !Ref MigrationApplicationImage
          User: '0'
          Command: [/bin/sh, -c, 'chmod 1777 /tmp']
          Essential: false
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
        - Name: migration
          Image: !Ref MigrationApplicationImage
          Command: [python, scripts/aws_entrypoint.py, sh, -c, 'alembic upgrade head && python -m scripts.seed_builtin_roles']
          DependsOn: [{ContainerName: scratch-init, Condition: SUCCESS}]
          Essential: true
          ReadonlyRootFilesystem: true
          MountPoints: [{SourceVolume: scratch, ContainerPath: /tmp, ReadOnly: false}]
          Environment: *ApplicationEnvironment
          Secrets: *ApplicationSecrets
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref ApplicationLogGroup, awslogs-region: !Ref AWS::Region, awslogs-stream-prefix: migration}}

  ApiScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !If [ServicesActive, 2, 0]
      MaxCapacity: 10
      ResourceId: !Join ['/', [service, !Ref Cluster, !GetAtt ApiService.Name]]
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ApiScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: api-cpu
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalableTarget
      TargetTrackingScalingPolicyConfiguration: {TargetValue: 55, PredefinedMetricSpecification: {PredefinedMetricType: ECSServiceAverageCPUUtilization}}

Outputs:
  ClusterName: {Value: !Ref Cluster}
  ApiServiceName: {Value: !GetAtt ApiService.Name}
  MigrationTaskDefinitionArn: {Value: !Ref MigrationTaskDefinition}
  AlbArn: {Value: !Ref InternalLoadBalancer}
  AlbDnsName: {Value: !GetAtt InternalLoadBalancer.DNSName}
  AlbFullName: {Value: !GetAtt InternalLoadBalancer.LoadBalancerFullName}
  ApiTargetGroupFullName: {Value: !GetAtt ApiTargetGroup.TargetGroupFullName}
